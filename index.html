<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tellme | Redesigned Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Боковая панель (Sidebar) -->
        <aside class="sidebar glass">
            <div class="sidebar-header">
                <button class="menu-btn">☰</button>
                <input type="text" class="search-bar" placeholder="Поиск...">
            </div>
            <div class="chat-list">
                <div class="chat-item active">
                    <div class="chat-avatar">🤖</div>
                    <div class="chat-info">
                        <h3>Tellme Support</h3>
                        <p>Система готова</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Основное окно чата -->
        <main class="chat-window glass">
            <!-- Шапка чата -->
            <div class="chat-header">
                <h2 id="active-chat-name">Tellme Support</h2>
                <!-- Сюда потом добавим кнопки, когда всё заработает -->
            </div>

            <!-- Область сообщений -->
            <div class="chat-messages" id="chat-box">
                <!-- Сообщения будут появляться здесь -->
            </div>

            <!-- Панель ввода сообщения -->
            <div class="chat-input-area">
                <button id="emoji-btn" class="input-action-btn">😊</button>
                <button id="attach-btn" class="input-action-btn">📎</button>
                <input type="text" id="msg-input" placeholder="Написать сообщение...">
                <button id="voice-btn" class="input-action-btn">🎤</button>
                <button id="send-btn" class="send-btn">➤</button>
            </div>
        </main>
    </div>
</body>
</html>
