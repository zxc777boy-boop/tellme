<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tellme | Full Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-pink">

<div class="pattern-overlay"></div>

<div id="main-drawer" class="drawer">
    <div class="drawer-header">
        <h2 id="drawer-title">Настройки</h2>
        <button onclick="closeDrawer()" class="close-btn">✕</button>
    </div>
    <div id="drawer-content" class="drawer-body"></div>
</div>

<div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal-window glass">
        <h3 id="modal-title"></h3>
        <div id="modal-body"></div>
        <button onclick="closeModal()" class="modal-close-btn">Закрыть</button>
    </div>
</div>

<div id="screen-auth" class="screen active">
    <button class="gear-trigger" onclick="openDrawer('settings')">⚙️</button>
    <div class="auth-card glass">
        <h1 class="brand">Tellme</h1>
        <div id="auth-inputs">
            <input type="email" placeholder="Email" id="auth-email">
            <input type="password" placeholder="Пароль" id="auth-pass">
        </div>
        <div class="auth-actions">
            <button class="btn-main" id="btn-primary" onclick="processAuth()">Войти</button>
            <button class="btn-sub" id="btn-secondary" onclick="toggleMode(true)">Регистрация</button>
        </div>
        <p id="mode-toggle" onclick="toggleMode(true)">Нет аккаунта? Зарегистрироваться</p>
    </div>
</div>

<div id="screen-app" class="screen">
    <aside class="app-sidebar glass">
        <div class="app-sidebar-header">
            <button class="burger-menu" onclick="openDrawer('profile')">☰</button>
            <input type="text" placeholder="Поиск..." class="search-input">
        </div>
        <div class="chat-list">
            <div class="chat-item active" onclick="switchChat('support', this)">
                <div class="chat-ava">TM</div>
                <div class="chat-details"><b>Support</b><p>Системный чат</p></div>
            </div>
            <div class="chat-item" onclick="switchChat('sanya', this)">
                <div class="chat-ava">👦</div>
                <div class="chat-details"><b>Саня [Друг]</b><p>Бро, зацени код!</p></div>
            </div>
        </div>
    </aside>

    <main class="chat-window">
        <div class="chat-top-bar glass">
            <h2 id="active-chat-name">Tellme Support</h2>
        </div>
        <div class="chat-messages" id="chat-box">
            <div class="msg system">Приветствуем в Tellme! Ваша сессия активна.</div>
        </div>
        <div class="chat-input-row glass">
            <button class="tool-btn" onclick="openModal('Эмодзи', '😊 😂 ❤️ 👍 🔥 🙌 ✨ 🚀')">😊</button>
            <button class="tool-btn" onclick="document.getElementById('file-inp').click()">📎</button>
            <input type="file" id="file-inp" style="display:none" onchange="alert('Файл выбран!')">
            <input type="text" id="msg-input" placeholder="Написать сообщение...">
            <button class="send-btn" onclick="sendMessage()">></button>
        </div>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
