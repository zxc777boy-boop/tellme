<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tellme | Твой мир</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="main-body" class="theme-pink">

<div class="bg-pattern"></div>

<div id="auth-screen" class="full-display">
    <button class="settings-icon-btn login-gear" onclick="toggleSidebar('settings-sidebar')">⚙️</button>
    
    <div class="glass-card auth-card">
        <h1 class="brand-logo">Tellme</h1>
        <div id="auth-fields" class="input-fields">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Пароль">
        </div>
        <div class="auth-btns-row">
            <button id="main-auth-btn" class="action-btn primary" onclick="enterApp()" data-lang="login_action">Войти</button>
            <button id="secondary-auth-btn" class="action-btn outline" onclick="toggleAuthMode(true)" data-lang="reg_btn_text">Регистрация</button>
        </div>
    </div>
</div>

<div id="settings-sidebar" class="sidebar-drawer">
    <div class="drawer-header">
        <h2 data-lang="settings_nav">Настройки</h2>
        <button class="close-drawer" onclick="toggleSidebar('settings-sidebar')">✕</button>
    </div>
    <div class="drawer-body">
        <div class="sidebar-section">
            <label data-lang="themes_label">Темы</label>
            <div class="theme-picker">
                <div class="theme-opt pink-opt active" onclick="changeTheme('pink')"></div>
                <div class="theme-opt blue-opt" onclick="changeTheme('blue')"></div>
                <div class="theme-opt dark-opt" onclick="changeTheme('dark')"></div>
                <div class="theme-opt white-opt" onclick="changeTheme('white')"></div>
            </div>
        </div>
        <div class="sidebar-section">
            <label data-lang="lang_label">Язык</label>
            <select class="mac-select" onchange="changeLanguage(this.value)">
                <option value="ru">Русский</option>
                <option value="ua">Українська</option>
                <option value="en">English</option>
                <option value="de">Deutsch</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
                <option value="it">Italiano</option>
                <option value="pl">Polski</option>
                <option value="tr">Türkçe</option>
                <option value="jp">日本語</option>
            </select>
        </div>
    </div>
</div>

<div id="app-screen" class="main-app" style="display: none;">
    <aside class="app-sidebar">
        <div class="sidebar-top">
            <button class="menu-btn" onclick="toggleSidebar('profile-sidebar')">☰</button>
            <input type="text" class="search-bar" placeholder="Поиск..." data-lang-placeholder="search_placeholder">
        </div>
        <div class="chat-list">
            <div class="chat-item active" onclick="switchChat('support', this)">
                <div class="chat-ava">TM</div>
                <div class="chat-info"><b>Tellme Support</b><p>Online</p></div>
            </div>
            <div class="chat-item" onclick="switchChat('sanya', this)">
                <div class="chat-ava">👦</div>
                <div class="chat-info"><b>Саня [Друг]</b><p>Как дела?</p></div>
            </div>
            <div class="chat-item" onclick="switchChat('team', this)">
                <div class="chat-ava">🚀</div>
                <div class="chat-info"><b>Команда Tellme</b><p>Фиксы готовы!</p></div>
            </div>
        </div>
    </aside>

    <main class="chat-window">
        <div class="chat-header">
            <h2 id="active-chat-name">Tellme Support</h2>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="msg system">Добро пожаловать!</div>
        </div>
        <div class="chat-input-zone">
            <button class="tool-btn" onclick="document.getElementById('file-up').click()">📎</button>
            <input type="file" id="file-up" hidden onchange="handleFile(this)">
            <input type="text" id="msg-input" placeholder="Сообщение..." data-lang-placeholder="input_placeholder">
            <button class="tool-btn" onclick="toggleEmoji()">😊</button>
            <button class="send-btn" onclick="sendMessage()">></button>
        </div>
        <div id="emoji-picker" class="emoji-pop" style="display:none;">
            <span onclick="addEmoji('😊')">😊</span> <span onclick="addEmoji('😂')">😂</span> <span onclick="addEmoji('❤️')">❤️</span> <span onclick="addEmoji('🔥')">🔥</span>
        </div>
    </main>

    <div id="profile-sidebar" class="sidebar-drawer">
        <div class="drawer-header">
            <h2 data-lang="profile_title">Профиль</h2>
            <button class="close-drawer" onclick="toggleSidebar('profile-sidebar')">✕</button>
        </div>
        <div class="drawer-body">
            <div class="profile-main">
                <div class="big-avatar">?</div>
                <div class="nick-edit-zone">
                    <input type="text" id="user-nick-input" value="@username" oninput="validateNick(this)">
                    <p id="nick-error" class="error-text" style="display:none;">Ник должен начинаться с @</p>
                </div>
            </div>
            
            <div class="sidebar-section">
                <label data-lang="edit_bio_label">О себе</label>
                <textarea id="user-bio" placeholder="Расскажите о себе..."></textarea>
                <button class="save-small-btn" onclick="saveBio()" data-lang="save">Сохранить</button>
            </div>

            <div class="sidebar-section">
                <label data-lang="privacy_label">Конфиденциальность</label>
                <div class="priv-toggle" onclick="togglePriv(this)">
                    <span data-lang="hide_name">Скрыть имя</span>
                    <div class="toggle-track"><div class="toggle-thumb"></div></div>
                </div>
            </div>

            <div class="sidebar-section">
                <label data-lang="themes_label">Темы</label>
                <div class="theme-picker">
                    <div class="theme-opt pink-opt" onclick="changeTheme('pink')"></div>
                    <div class="theme-opt blue-opt" onclick="changeTheme('blue')"></div>
                    <div class="theme-opt dark-opt" onclick="changeTheme('dark')"></div>
                    <div class="theme-opt white-opt" onclick="changeTheme('white')"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
