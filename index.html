<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tellme</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-pink">

<div class="bg-pattern"></div>

<div class="mac-window">
    <div class="traffic-lights">
        <span class="t-red"></span>
        <span class="t-yellow"></span>
        <span class="t-green"></span>
    </div>

    <div id="modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal-window glass">
            <h3 id="modal-title"></h3>
            <div id="modal-body" class="mac-scroll"></div>
            <div class="modal-footer">
                <button onclick="applyModal()" class="mac-btn-blue">Сохранить</button>
                <button onclick="closeModal()" class="mac-btn-ghost">Отмена</button>
            </div>
        </div>
    </div>

    <div id="drawer" class="mac-drawer glass">
        <div class="drawer-header">
            <h2 id="drawer-header-title">Профиль</h2>
            <button onclick="closeDrawer()" class="mac-close-btn">✕</button>
        </div>
        <div id="drawer-content" class="drawer-scroll mac-scroll"></div>
    </div>

    <div id="screen-auth" class="screen active">
        <button class="mac-gear-btn" onclick="openDrawer('settings')">⚙️</button>
        <div class="auth-box">
            <h1 class="mac-logo">Tellme</h1>
            <div id="auth-fields" class="mac-inputs"></div>
            <button id="main-auth-btn" class="mac-btn-blue" onclick="handleAuth()">Войти</button>
            <div id="auth-toggle" class="mac-toggle-link"></div>
        </div>
    </div>

    <div id="screen-app" class="screen">
        <aside class="mac-sidebar glass">
            <div class="sidebar-top">
                <button class="mac-burger" onclick="openDrawer('profile')">☰</button>
                <input type="text" placeholder="Поиск" class="mac-search">
            </div>
            <div class="chat-list" id="chat-list"></div>
        </aside>

        <main class="mac-chat-area">
            <div class="chat-header glass">
                <h2 id="active-chat-name">Tellme Support</h2>
            </div>
            <div class="chat-history mac-scroll" id="chat-box"></div>

            <div id="emoji-drawer" class="emoji-popover glass">
                <div class="emoji-tabs">
                    <span onclick="filterEmoji('smiles')">😊</span>
                    <span onclick="filterEmoji('food')">🍎</span>
                    <span onclick="filterEmoji('flags')">🏁</span>
                </div>
                <div id="emoji-grid" class="emoji-grid mac-scroll"></div>
            </div>

            <footer class="mac-input-row glass">
                <button class="mac-tool" onclick="toggleEmoji()">😊</button>
                <button class="mac-tool" onclick="document.getElementById('file-input').click()">📎</button>
                <input type="file" id="file-input" style="display:none">
                <input type="text" id="msg-input" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMsg()">
                <button class="mac-send-btn" onclick="sendMsg()">➤</button>
            </footer>
        </main>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
