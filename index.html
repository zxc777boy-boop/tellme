<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tellme | Твой мир</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="main-body" class="theme-default">

<div id="privacy-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <h4 id="modal-title">Настройка</h4>
        <div class="modal-btns">
            <button class="pub-btn" onclick="setPrivacy('public')">Публичный</button>
            <button class="priv-btn" onclick="setPrivacy('hidden')">Скрытый</button>
        </div>
        <button class="modal-close" onclick="closeModal()">Отмена</button>
    </div>
</div>

<div id="auth-screen" class="full-display">
    <div class="glass-card auth-card">
        <h1 class="brand-logo">Tellme</h1>
        <div class="input-fields">
            <input type="email" id="email" placeholder="Почта" value="zxc777boy@gmail.com">
            <input type="text" id="username" placeholder="@username" value="@click">
            <input type="password" id="pass" placeholder="Пароль">
            <input type="password" id="pass-confirm" placeholder="Повтор пароля">
        </div>
        <button class="action-btn" onclick="startApp()">Войти в мир</button>
    </div>
</div>

<div id="app-screen" class="main-app" style="display: none;">
    
    <div id="settings-drawer" class="settings-drawer">
        <div class="drawer-header">
            <h3>Профиль</h3>
            <button class="close-drawer" onclick="closeSettings()">✕</button>
        </div>
        <div class="settings-body mac-settings">
            <div class="profile-main">
                <div class="large-avatar" id="display-avatar">?</div>
                
                <div class="nick-row">
                    <span id="user-display-nick">@username</span>
                    <button class="edit-icon-btn" onclick="editUsername()">✏️</button>
                </div>
            </div>

            <div class="settings-section">
                <h4>Описание</h4>
                <textarea id="bio-change" placeholder="Расскажите о себе..."></textarea>
                <button class="mac-save-btn" onclick="saveData()">Сохранить</button>
            </div>

            <div class="settings-section">
                <h4>Темы</h4>
                <div class="theme-picker">
                    <button class="theme-opt pink-opt" onclick="changeTheme('pink')"></button>
                    <button class="theme-opt blue-opt" onclick="changeTheme('blue')"></button>
                    <button class="theme-opt dark-opt" onclick="changeTheme('dark')"></button>
                    <button class="theme-opt white-opt" onclick="changeTheme('white')"></button>
                </div>
            </div>

            <div class="settings-section">
                <h4>Конфиденциальность</h4>
                <div class="mac-menu">
                    <button onclick="openModal('аватарки')">Скрыть аватарку <span>></span></button>
                    <button onclick="openModal('юзернейма')">Скрыть юзернейм <span>></span></button>
                </div>
            </div>
        </div>
    </div>

    <aside class="mac-sidebar">
        <div class="sidebar-header">
            <button class="settings-icon-btn" onclick="openSettings()">⚙️</button>
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Поиск...">
            </div>
        </div>
        <div class="chat-list" id="chats">
            <div class="chat-item active">
                <div class="avatar-circle">TM</div>
                <div class="chat-meta">
                    <span class="nick">Tellme Support</span>
                    <span class="text-preview">Вы в системе!</span>
                </div>
            </div>
        </div>
    </aside>

    <section class="chat-viewport">
        <div class="top-bar"><h2>Tellme Support</h2></div>
        <div class="history" id="chat-history">
            <div class="bubble received">Поздравляем! Визуал обновлен. Попробуй новый поиск и шторку настроек.</div>
        </div>
        <div class="input-row">
            <input type="text" id="m-input" placeholder="Напишите сообщение...">
            <button class="round-send-btn" onclick="sendMsg()">
                <span class="arrow-icon">></span>
            </button>
        </div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
