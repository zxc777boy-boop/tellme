<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tellme | Твой мир</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="main-body" class="theme-default">

<div id="privacy-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <h4 id="modal-title">Настройка</h4>
        <div class="modal-btns">
            <button class="pub-btn" onclick="setPrivacy('public')">Публичный</button>
            <button class="priv-btn" onclick="setPrivacy('hidden')">Скрытый</button>
        </div>
        <button class="modal-close" onclick="closeModal()">Отмена</button>
    </div>
</div>

<div id="auth-screen" class="full-display">
    <div class="glass-card auth-card">
        <h1 class="brand-logo">Tellme</h1>
        <div class="input-fields">
            <input type="email" id="email" placeholder="Почта" value="zxc777boy@gmail.com">
            <input type="text" id="username" placeholder="@username" value="@click">
            <input type="password" id="pass" placeholder="Пароль">
            <input type="password" id="pass-confirm" placeholder="Повтор пароля">
        </div>
        <button class="action-btn" onclick="startApp()">Войти в мир</button>
    </div>
</div>

<div id="app-screen" class="main-app" style="display: none;">
    
    <div id="settings-drawer" class="settings-drawer">
        <div class="drawer-header">
            <h3>Настройки</h3>
            <button class="close-drawer" onclick="closeSettings()">✕</button>
        </div>
        <div class="settings-body">
            <div class="profile-preview">
                <div class="large-avatar" id="display-avatar">?</div>
                <div class="copy-nick-wrapper" onclick="copyToClipboard()">
                    <span id="user-display-nick">@username</span>
                    <small>Нажми, чтобы скопировать</small>
                </div>
                <button class="upload-btn">Сменить фото</button>
            </div>

            <div class="settings-section">
                <h4>Конфиденциальность</h4>
                <div class="menu-list">
                    <button onclick="openModal('аватарки')">Скрыть аватарку</button>
                    <button onclick="openModal('юзернейма')">Скрыть юзернейм</button>
                    <button onclick="openModal('описания')">Скрыть описание</button>
                </div>
            </div>

            <div class="settings-section">
                <h4>Темы оформления</h4>
                <div class="theme-grid">
                    <button class="t-btn t-pink" onclick="changeTheme('pink')">Розовый</button>
                    <button class="t-btn t-blue" onclick="changeTheme('blue')">Синий</button>
                    <button class="t-btn t-dark" onclick="changeTheme('dark')">Тёмная</button>
                    <button class="t-btn t-white" onclick="changeTheme('white')">Светлая</button>
                </div>
            </div>

            <div class="form-group">
                <label>О себе</label>
                <textarea id="bio-change" placeholder="Расскажите о себе..."></textarea>
                <button class="save-btn" onclick="saveData()">Сохранить</button>
            </div>
        </div>
    </div>

    <aside class="mac-sidebar">
        <div class="sidebar-top">
            <button class="settings-icon-btn" onclick="openSettings()">⚙️</button>
            <input type="text" id="search-input" placeholder="Поиск...">
        </div>
        <div class="chat-list" id="chats">
            <div class="chat-item active">
                <div class="avatar-circle">TM</div>
                <div class="chat-meta">
                    <span class="nick">Tellme Support</span>
                    <span class="text-preview">Добро пожаловать!</span>
                </div>
            </div>
        </div>
    </aside>

    <section class="chat-viewport">
        <div class="top-bar"><h2>Tellme Support</h2></div>
        <div class="history" id="chat-history">
            <div class="bubble received">Поздравляем! Теперь ты в системе. Попробуй изменить тему или профиль.</div>
        </div>
        <div class="input-row">
            <input type="text" id="m-input" placeholder="Сообщение...">
            <button class="send-btn" onclick="sendMsg()">></button>
        </div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
