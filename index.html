<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Tellme | Premium Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-pink">

<div id="side-drawer" class="drawer">
    <div class="drawer-header">
        <h2 id="drawer-title">Настройки</h2>
        <button onclick="toggleDrawer()" class="close-btn">✕</button>
    </div>
    <div id="drawer-content" class="drawer-body">
        </div>
</div>

<div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal-window">
        <h3 id="modal-title"></h3>
        <div id="modal-body"></div>
        <div class="modal-footer">
            <button onclick="closeModal()" class="btn-sub">Закрыть</button>
        </div>
    </div>
</div>

<div id="auth-screen" class="full-screen active">
    <button class="gear-icon" onclick="openDrawer('settings')">⚙️</button>
    <div class="auth-container glass">
        <h1 class="logo">Tellme</h1>
        <div id="auth-form" class="form-group">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Пароль">
        </div>
        <div class="auth-actions">
            <button class="btn-primary" id="main-btn" onclick="handleAuth()">Войти</button>
            <button class="btn-outline" id="sub-btn" onclick="toggleAuthMode()">Регистрация</button>
        </div>
        <p class="toggle-text" onclick="toggleAuthMode()" id="switch-text">Нет аккаунта? Зарегистрироваться</p>
    </div>
</div>

<div id="app-screen" class="full-screen">
    <aside class="sidebar-left glass">
        <div class="side-head">
            <button class="burger" onclick="openDrawer('profile')">☰</button>
            <input type="text" placeholder="Поиск..." class="search-bar">
        </div>
        <div class="chat-list" id="chat-list">
            <div class="chat-item active" onclick="selectChat('support', this)">
                <div class="ava">TM</div>
                <div class="chat-info"><b>Support</b><p>Онлайн</p></div>
            </div>
            <div class="chat-item" onclick="selectChat('sanya', this)">
                <div class="ava">👦</div>
                <div class="chat-info"><b>Саня</b><p>Придешь?</p></div>
            </div>
        </div>
    </aside>

    <main class="chat-area">
        <div class="chat-head">
            <h2 id="current-chat">Tellme Support</h2>
        </div>
        <div class="chat-messages" id="msg-box">
            <div class="msg system">Добро пожаловать в систему!</div>
        </div>
        <div class="chat-input glass">
            <button onclick="openModal('Эмодзи', '😊 😂 ❤️ 👍 🔥')">😊</button>
            <input type="text" id="m-input" placeholder="Напишите сообщение...">
            <button class="send-btn" onclick="sendMsg()">></button>
        </div>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
