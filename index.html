<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tellme | Твой мир</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="main-body" class="theme-default">

<div id="custom-modal" class="modal-overlay" style="display: none;">
    <div class="glass-card modal-window">
        <h3 id="modal-header">Настройка</h3>
        <div id="modal-content-area">
            </div>
        <button class="modal-close-btn" onclick="closeCustomModal()" data-lang="close">Закрыть</button>
    </div>
</div>

<div id="auth-screen" class="full-display">
    <div class="glass-card auth-card">
        <h1 class="brand-logo">Tellme</h1>
        <div class="input-fields">
            <input type="email" id="email" placeholder="Почта" value="zxc777boy@gmail.com">
            <input type="text" id="username" placeholder="@username" value="@click">
            <input type="password" id="pass" placeholder="Пароль">
        </div>
        <button class="action-btn" onclick="startApp()" data-lang="login_btn">Войти в мир</button>
    </div>
</div>

<div id="app-screen" class="main-app" style="display: none;">
    <div id="settings-drawer" class="settings-drawer">
        <div class="drawer-header">
            <h3 data-lang="settings_title">Настройки</h3>
            <button onclick="closeSettings()">✕</button>
        </div>
        
        <div class="settings-body">
            <div class="profile-main">
                <div class="large-avatar">?</div>
                <div class="nick-row">
                    <span id="user-display-nick">@username</span>
                    <button class="edit-btn" onclick="editUsername()">✏️</button>
                </div>
                <button class="add-acc-btn" onclick="showAddAccount()" data-lang="add_account">+ Добавить аккаунт</button>
            </div>

            <div class="settings-section">
                <h4 data-lang="bio_label">Описание</h4>
                <textarea id="bio-change" placeholder="..."></textarea>
                <button class="mac-save-btn" onclick="saveData()" data-lang="save_btn">Сохранить</button>
            </div>

            <div class="settings-section">
                <h4 data-lang="themes_label">Темы</h4>
                <div class="theme-picker">
                    <button class="theme-opt pink-opt" onclick="changeTheme('pink')"></button>
                    <button class="theme-opt blue-opt" onclick="changeTheme('blue')"></button>
                    <button class="theme-opt dark-opt" onclick="changeTheme('dark')"></button>
                    <button class="theme-opt white-opt" onclick="changeTheme('white')"></button>
                </div>
            </div>

            <div class="settings-section">
                <h4 data-lang="privacy_label">Конфиденциальность</h4>
                <div class="mac-menu">
                    <button onclick="showPrivacyMenu()" data-lang="privacy_btn">Настроить скрытие <span>></span></button>
                </div>
            </div>

            <div class="settings-section">
                <h4 data-lang="lang_label">Язык / Language</h4>
                <div class="mac-menu">
                    <button onclick="showLanguageMenu()"><span id="current-lang-name">Русский</span> <span>></span></button>
                </div>
            </div>
        </div>
    </div>

    <aside class="mac-sidebar">
        <div class="sidebar-header">
            <button class="settings-icon-btn" onclick="openSettings()">⚙️</button>
            <div class="search-wrapper">
                <input type="text" id="search-input" placeholder="Поиск..." data-lang-placeholder="search_placeholder">
            </div>
        </div>
        <div class="chat-list">
            <div class="chat-item active">
                <div class="avatar-circle">TM</div>
                <div class="chat-meta">
                    <span class="nick">Tellme Support</span>
                    <span class="text-preview" data-lang="welcome_msg">Вы в системе!</span>
                </div>
            </div>
        </div>
    </aside>

    <section class="chat-viewport">
        <div class="top-bar"><h2>Tellme Support</h2></div>
        <div class="history" id="chat-history">
            <div class="bubble received" data-lang="chat_hint">Визуал обновлен! Проверь настройки языка и конфиденциальности.</div>
        </div>
        <div class="input-row">
            <input type="text" id="m-input" placeholder="Сообщение..." data-lang-placeholder="input_placeholder">
            <button class="round-send-btn" onclick="sendMsg()">></button>
        </div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
