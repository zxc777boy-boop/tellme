<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TellMe | Messenger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="main-body" class="auth-page">

<div id="auth-screen" class="screen-container">
    <div class="auth-card">
        <h1 class="logo-text">Tell me</h1>
        <div class="inputs">
            <input type="email" id="email" placeholder="Почта" value="zxc777boy@gmail.com">
            <input type="text" id="username" placeholder="@username" value="@click">
            <input type="password" id="pass" placeholder="Пароль">
            <input type="password" id="pass-confirm" placeholder="Повтор пароля">
        </div>
        <button class="main-btn" onclick="handleAuth()">Войти в мир</button>
    </div>
</div>

<div id="app-screen" class="app-container" style="display: none;">
    <aside class="sidebar">
        <div class="side-header">
            <input type="text" placeholder="Поиск по юзернейму..." oninput="searchPeople()">
        </div>
        <div class="chat-list">
            <div class="chat-item active">
                <div class="avatar">TM</div>
                <div class="info">
                    <span class="nick">TellMe Support</span>
                    <span class="preview">Добро пожаловать в TellMe!</span>
                </div>
            </div>
        </div>
        <button class="settings-trigger" onclick="toggleSettings(true)">⚙️ Настройки</button>
    </aside>

    <main class="chat-area">
        <div id="chat-content">
            <div class="chat-header"><h2>TellMe Support</h2></div>
            <div class="messages" id="msg-box">
                <div class="msg bot">Привет! Теперь ты в системе. Попробуй изменить профиль.</div>
            </div>
            <div class="input-bar">
                <input type="text" id="m-input" placeholder="Написать сообщение...">
                <button onclick="sendMsg()">Отправить</button>
            </div>
        </div>

        <div id="settings-panel" style="display: none;">
            <div class="set-header">
                <h3>Профиль</h3>
                <button onclick="toggleSettings(false)">✕</button>
            </div>
            <div class="set-body">
                <div class="profile-pic" id="p-avatar">?</div>
                <input type="file" id="file-up" hidden>
                <button class="sub-btn" onclick="document.getElementById('file-up').click()">Сменить аватарку</button>
                
                <label>Юзернейм</label>
                <input type="text" id="set-nick" placeholder="Минимум 3 символа">
                
                <label>Описание</label>
                <textarea id="set-bio" placeholder="О себе..."></textarea>
                
                <button class="save-btn" onclick="saveData()">Сохранить</button>
            </div>
        </div>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
